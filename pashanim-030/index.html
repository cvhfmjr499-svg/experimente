<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PASHANIM // 030</title>
<style>
@font-face { font-family: "ArchivoV"; src: url("assets/fonts/archivo-var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Serif"; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; }
@font-face { font-family: "Serif"; src: url("assets/fonts/instrument-serif.woff2") format("woff2"); font-style: normal; }
@font-face { font-family: "Mono"; src: url("assets/fonts/jetbrains-mono-var.woff2") format("woff2"); font-weight: 100 800; }

:root {
  --ink: #0b0b0b; --paper: #f2eee5; --orange: #ff4a0d; --sun: #ffc21a;
  --navy: #060a1f; --volt: #5b78ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#viewport { position: fixed; inset: 0; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--ink); transform-origin: 0 0; font-family: "Mono", monospace; color: var(--paper); }
.layer { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; overflow: hidden; display: none; }
.abs { position: absolute; }
.mono { font-family: "Mono", monospace; text-transform: uppercase; letter-spacing: .18em; white-space: pre; }
.big { font-family: "ArchivoV", sans-serif; line-height: 1; white-space: nowrap; }
.serif { font-family: "Serif", serif; font-style: italic; line-height: .95; white-space: nowrap; }
.m { display: inline-block; overflow: hidden; vertical-align: top; }
.m > span { display: inline-block; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; z-index: 100; pointer-events: none; color: var(--hud, #f2eee5); }
#hud .mk { position: absolute; width: 26px; height: 26px; border-color: currentColor; border-style: solid; opacity: .75; }
#hud .mk.tl { left: 30px; top: 30px; border-width: 1.5px 0 0 1.5px; }
#hud .mk.tr { right: 30px; top: 30px; border-width: 1.5px 1.5px 0 0; }
#hud .mk.bl { left: 30px; bottom: 30px; border-width: 0 0 1.5px 1.5px; }
#hud .mk.br { right: 30px; bottom: 30px; border-width: 0 1.5px 1.5px 0; }
#hud .lbl { position: absolute; font-size: 14px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; white-space: pre; }
#hudTL { left: 72px; top: 40px; }
#hudTR { right: 72px; top: 40px; display: flex; gap: 18px; align-items: center; }
#hudBL { left: 72px; bottom: 46px; }
#hudBR { right: 72px; bottom: 42px; display: flex; align-items: flex-end; gap: 14px; }
#hud .dim { opacity: .55; }
#vu { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
#vu i { display: block; width: 3px; background: currentColor; height: 3px; }
#year { display: flex; font-size: 30px; font-weight: 700; letter-spacing: .02em; line-height: 30px; height: 30px; }
#year .dg { display: block; width: .62em; height: 30px; overflow: hidden; position: relative; }
#year .strip { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; }
#year .strip b { display: block; height: 30px; font-weight: 700; text-align: center; width: .62em; }
#prog { position: absolute; left: 72px; right: 72px; bottom: 30px; height: 1.5px; }
#prog i { display: block; height: 100%; background: currentColor; transform-origin: 0 50%; opacity: .8; }

/* ---------- global overlays ---------- */
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 90; pointer-events: none; }
#black { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 95; pointer-events: none; }
#vignette { position: absolute; inset: 0; z-index: 89; pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.42) 100%); }
#world { position: absolute; inset: 0; }

/* ---------- S1 030 ---------- */
#s1 { z-index: 10; }
#s1svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.s1cap { position: absolute; font-size: 15px; line-height: 1.6; }
.s1cap b { display: block; font-size: 22px; font-weight: 700; letter-spacing: .16em; }

/* ---------- S2 PASHANIM ---------- */
#s2 { z-index: 5; }
#s2bg { background:
  radial-gradient(circle at 64% 42%, #ff5a17 0%, #f23d05 18%, #a81f02 38%, #3a0d03 60%, #100604 82%); }
#s2dots { opacity: .16; mix-blend-mode: multiply;
  background-image: radial-gradient(circle, #000 1.3px, transparent 1.7px); background-size: 9px 9px; }
#s2cut { position: absolute; left: 388px; top: -117px; width: 1490px; height: 1490px; transform-origin: 862px 587px; }
.bigname { position: absolute; left: 960px; top: 268px; font-weight: 900; color: var(--paper); }
.bigname.outline { color: transparent; -webkit-text-stroke: 2px var(--paper); }
#s2cap { left: 96px; top: 846px; font-size: 16px; line-height: 1.75; }
#s2cap b { display: block; font-size: 26px; font-weight: 700; letter-spacing: .14em; }
#s2zip { position: absolute; left: 0; top: 539px; width: 1920px; height: 3px; background: var(--paper);
  transform-origin: 0 50%; z-index: 22; display: none; box-shadow: 0 0 18px rgba(255,255,255,.6); }

/* ---------- S3 AIRWAVES ---------- */
#s3 { z-index: 20; background: linear-gradient(#0b0b0b, #0f1218); }
#s3svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#s3title { left: 960px; top: 150px; font-weight: 250; color: var(--paper); }
#s3counter { left: 100px; top: 560px; font-family: "ArchivoV"; font-weight: 900; font-size: 400px; line-height: 1;
  font-variation-settings: "wdth" 62, "wght" 900; display: flex; align-items: flex-start; transform-origin: 0 100%; }
#s3counter .h { font-size: .42em; margin-top: .08em; margin-right: .04em; color: var(--orange); }
#s3cap { left: 112px; top: 958px; font-size: 16px; }
#s3card { left: 1384px; top: 586px; width: 380px; height: 380px; transform-origin: 50% 100%;
  box-shadow: 0 30px 60px rgba(0,0,0,.55); }
#s3card img { width: 100%; height: 100%; display: block; }
#s3card .tag { position: absolute; left: 0; top: -34px; font-size: 13px; }

/* ---------- S4 SOMMERGEWITTER ---------- */
#s4 { z-index: 30; background: radial-gradient(ellipse 120% 90% at 60% 0%, #16245c 0%, #0a1236 40%, #050817 78%); }
#s4cam { position: absolute; inset: 0; transform-origin: 960px 540px; }
#s4clouds { opacity: .0; background:
  radial-gradient(ellipse 30% 18% at 20% 12%, rgba(150,170,255,.55), transparent 70%),
  radial-gradient(ellipse 34% 20% at 62% 8%, rgba(170,190,255,.6), transparent 70%),
  radial-gradient(ellipse 26% 16% at 88% 20%, rgba(140,160,255,.45), transparent 70%); }
#s4rain { position: absolute; inset: 0; }
#s4svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
#s4text { left: 104px; top: 196px; }
#s4text .ln { display: block; font-size: 292px; line-height: .86; font-weight: 900; letter-spacing: -.005em; }
#s4one { left: 1338px; top: 262px; font-weight: 900; font-size: 520px; color: var(--orange); transform-origin: 50% 70%;
  font-variation-settings: "wdth" 62, "wght" 900; }
#s4cap { left: 1362px; top: 860px; font-size: 18px; line-height: 1.7; }
#s4white { position: absolute; inset: 0; background: #fff; opacity: 0; }

/* ---------- S5 2000 ---------- */
#s5 { z-index: 40; color: var(--ink); }
#s5inner { position: absolute; inset: 0; background: var(--paper); }
#s5grid { opacity: .08; background-image:
  linear-gradient(var(--ink) 1px, transparent 1px), linear-gradient(90deg, var(--ink) 1px, transparent 1px);
  background-size: 60px 60px; background-position: 0 0; }
#s5svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
#s5card { position: absolute; left: 660px; top: 196px; width: 600px; height: 600px; perspective: 1400px; }
#s5tiles { position: absolute; inset: 0; transform-style: preserve-3d; }
.tile { position: absolute; width: 120px; height: 120px; background-size: 600px 600px; backface-visibility: hidden; }
#s5shadow { position: absolute; left: 660px; top: 196px; width: 600px; height: 600px; box-shadow: 0 40px 80px rgba(0,0,0,.35); opacity: 0; }
#s5stamp { position: absolute; left: 1120px; top: 92px; width: 280px; height: 280px; transform-origin: 50% 50%; }
#s5cap { left: 0; width: 1920px; text-align: center; top: 838px; font-size: 18px; font-weight: 600; }
#s5white { position: absolute; inset: 0; background: #fff; }

/* ---------- S6 NR.1 BOARD ---------- */
#s6 { z-index: 50; }
#s6inner { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #1d1d1d 0%, #0d0d0d 70%); }
#s6board { position: absolute; inset: 0; transform: scale(1.04); transform-origin: 960px 540px; }
#s6ghost { left: 960px; top: 260px; font-size: 600px; font-weight: 900; color: transparent; -webkit-text-stroke: 1.5px rgba(242,238,229,.09);
  font-variation-settings: "wdth" 125, "wght" 900; }
#s6head { left: 136px; top: 290px; font-size: 16px; display: flex; gap: 40px; width: 1648px; justify-content: space-between; }
.row { position: absolute; left: 136px; height: 80px; display: flex; gap: 6px; align-items: center; }
.thumb { width: 80px; height: 80px; margin-right: 18px; background-size: cover; transform-origin: 50% 50%; }
.cell { position: relative; width: 56px; height: 80px; perspective: 300px; }
.cell .half { position: absolute; left: 0; width: 56px; height: 40px; overflow: hidden; background: #1e1e1e;
  backface-visibility: hidden; }
.cell .half.t { top: 0; border-radius: 6px 6px 0 0; transform-origin: 50% 100%; }
.cell .half.b { top: 40px; border-radius: 0 0 6px 6px; transform-origin: 50% 0%; }
.cell .half span { position: absolute; left: 0; width: 56px; height: 80px; line-height: 80px; text-align: center;
  font-family: "ArchivoV"; font-size: 54px; font-weight: 800; font-variation-settings: "wdth" 90, "wght" 800; color: var(--paper); }
.cell .half.b span { top: -40px; }
.cell .half.t span { top: 0; }
.cell .seam { position: absolute; left: 0; top: 39px; width: 56px; height: 2px; background: #050505; z-index: 5; }
.cell.hi .half { background: var(--orange); }
.cell.hi .half span { color: var(--ink); }
.cell.pk .half span { color: var(--orange); }
.cell.hi.pk .half span { color: var(--ink); }
#s6flood { position: absolute; background: var(--orange); display: none; }

/* ---------- S7 LOUNGE MUSIK ---------- */
#s7 { z-index: 60; }
#s7inner { position: absolute; inset: 0; background: linear-gradient(115deg, #ff4a0d 0%, #ff5c0a 45%, #ff8a00 78%, #ffb000 100%); }
#s7grain { opacity: .22; mix-blend-mode: multiply;
  background-image: radial-gradient(circle, rgba(0,0,0,.9) 1px, transparent 1.6px); background-size: 7px 7px; }
#s7cut { position: absolute; left: 840px; top: 0; width: 1080px; height: 1080px; transform-origin: 50% 100%; }
#s7title { left: 98px; top: 150px; color: var(--paper); }
#s7title .ln { display: block; font-size: 300px; }
#s7badges { left: 104px; top: 760px; display: flex; gap: 18px; }
.badge { height: 64px; padding: 0 26px; display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--paper);
  font-family: "Mono"; font-weight: 800; font-size: 26px; letter-spacing: .08em; border-radius: 40px; transform-origin: 50% 50%; }
.badge em { font-style: normal; color: var(--orange); }
#s7cap { left: 110px; top: 868px; font-size: 18px; font-weight: 600; color: var(--ink); }

/* ---------- S8 HIMMEL / TEMPELHOF ---------- */
#s8 { z-index: 70; background: #3d8bff; }
#s8inner { position: absolute; inset: 0; }
#s8sky { position: absolute; left: -40px; top: -560px; width: 2000px; height: 2000px; filter: saturate(1.45) contrast(1.06); }
#s8shade { background: linear-gradient(90deg, rgba(12,62,190,.62) 0%, rgba(12,62,190,.36) 36%, rgba(12,62,190,0) 64%),
  linear-gradient(0deg, rgba(12,52,170,.4) 0%, rgba(12,52,170,0) 42%); }
#s8rays { position: absolute; left: 960px; top: -300px; width: 2600px; height: 2600px; margin-left: -1300px; margin-top: -1300px;
  mix-blend-mode: screen; opacity: .22;
  background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.9) 0deg 4deg, rgba(255,255,255,0) 4deg 15deg);
  -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 30%, transparent 62%);
          mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 30%, transparent 62%); }
#s8cut { position: absolute; left: 720px; top: -150px; width: 1240px; height: 1240px; }
#s8title { left: 100px; top: 210px; color: #fff; filter: drop-shadow(0 4px 26px rgba(0,30,110,.45)); }
#s8title .ln { display: block; font-size: 190px; }
#s8cap { left: 108px; top: 690px; font-size: 18px; line-height: 1.8; color: #fff; }
#s8cap b { font-size: 26px; font-weight: 800; letter-spacing: .12em; display: block; }
#s8flare { position: absolute; left: 960px; top: 60px; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px;
  background: radial-gradient(circle, #fff 0%, #fff 22%, rgba(255,255,255,.0) 50%); opacity: 0; transform-origin: 50% 50%; }

/* ---------- S9 END ---------- */
#s9 { z-index: 80; background: var(--ink); }
#s9logo { left: 960px; top: 372px; font-weight: 900; font-size: 196px; color: var(--paper); }
#s9line { position: absolute; left: 960px; top: 616px; height: 1.5px; width: 620px; margin-left: -310px; background: var(--paper); transform-origin: 50% 50%; }
#s9tag { left: 0; width: 1920px; text-align: center; top: 646px; font-size: 64px; color: var(--paper); }
#s9tag span { display: inline-block; margin: 0 .12em; }
#s9small { left: 0; width: 1920px; text-align: center; top: 772px; font-size: 15px; }
#s9fan { left: 72px; bottom: 74px; font-size: 12px; opacity: .45; }

/* ---------- preview UI ---------- */
#ui { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 14px;
  background: rgba(0,0,0,.6); color: #ddd; font: 12px/1 "Mono", monospace; z-index: 1000; }
#ui button { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px 10px; font: inherit; cursor: pointer; }
#ui input[type=range] { flex: 1; }
body.render #ui { display: none; }
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <div id="world">

    <!-- S1 · 030 -->
    <section class="scene" id="s1">
      <svg id="s1svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="tritone" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer>
              <feFuncR type="linear" slope="1.45" intercept="-0.16"/><feFuncG type="linear" slope="1.45" intercept="-0.16"/><feFuncB type="linear" slope="1.45" intercept="-0.16"/>
            </feComponentTransfer>
            <feComponentTransfer>
              <feFuncR type="table" tableValues="0.035 1.0 0.96"/><feFuncG type="table" tableValues="0.035 0.27 0.94"/><feFuncB type="table" tableValues="0.035 0.04 0.90"/>
            </feComponentTransfer>
          </filter>
        </defs>
        <g id="s1cam">
          <path id="s1bg" fill="#0b0b0b" fill-rule="evenodd" d="M-60 -60 H1980 V1140 H-60 Z"/>
          <g id="s1digits"></g>
        </g>
      </svg>
      <div class="s1cap mono" id="s1capL"></div>
      <div class="s1cap mono" id="s1capR" style="text-align:right"></div>
    </section>

    <!-- S2 · PASHANIM -->
    <section class="scene" id="s2">
      <div class="layer" id="s2zoom">
        <div class="layer" id="s2bg"></div>
        <div class="layer" id="s2dots"></div>
        <div class="big bigname" id="s2back">PASHANIM</div>
        <img id="s2cut" src="assets/img/portrait_cut.png" alt="">
        <div class="big bigname outline" id="s2front">PASHANIM</div>
        <div class="abs mono" id="s2cap"></div>
      </div>
    </section>
    <div id="s2zip"></div>

    <!-- S3 · AIRWAVES -->
    <section class="scene" id="s3">
      <svg id="s3svg" viewBox="0 0 1920 1080">
        <defs>
          <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
        </defs>
        <path id="s3glow" fill="none" stroke="#5b78ff" stroke-width="10" filter="url(#glow3)" opacity="0"/>
        <path id="s3path" fill="none" stroke="#f2eee5" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <div class="abs big" id="s3title">AIRWAVES</div>
      <div class="abs" id="s3counter"><span class="h">#</span><span id="s3num">100</span></div>
      <div class="abs mono" id="s3cap"></div>
      <div class="abs" id="s3card"><div class="tag mono">SINGLE · 14.05.2020</div><img src="assets/img/airwaves.jpg" alt=""></div>
    </section>

    <!-- S4 · SOMMERGEWITTER -->
    <section class="scene" id="s4">
      <div id="s4cam">
        <div class="layer" id="s4clouds"></div>
        <canvas id="s4rain" width="1920" height="1080"></canvas>
        <svg id="s4svg" viewBox="0 0 1920 1080">
          <defs>
            <filter id="glow4" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
            <filter id="glow4b" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>
          </defs>
          <g id="s4bolt" opacity="0">
            <path id="s4boltGlow" fill="none" stroke="#5b78ff" stroke-width="26" filter="url(#glow4)" stroke-linejoin="round"/>
            <path id="s4boltMid" fill="none" stroke="#a9bbff" stroke-width="9" filter="url(#glow4b)" stroke-linejoin="round"/>
            <path id="s4boltCore" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
          </g>
        </svg>
        <div class="abs big" id="s4text"><span class="ln" id="s4l1">SOMMER</span><span class="ln" id="s4l2">GEWITTER</span></div>
        <div class="abs big" id="s4one">#1</div>
        <div class="abs mono" id="s4cap"></div>
      </div>
      <div id="s4white"></div>
    </section>

    <!-- S5 · 2000 -->
    <section class="scene" id="s5">
      <div id="s5inner">
        <div class="layer" id="s5grid"></div>
        <svg id="s5svg" viewBox="0 0 1920 1080"><g id="s5digits"></g></svg>
        <div id="s5shadow"></div>
        <div id="s5card"><div id="s5tiles"></div><img id="s5face" src="assets/img/album_2000.jpg" alt=""
          style="position:absolute;inset:0;width:600px;height:600px;opacity:0"></div>
        <svg id="s5stamp" viewBox="0 0 280 280">
          <defs><path id="ring" d="M140,140 m-104,0 a104,104 0 1,1 208,0 a104,104 0 1,1 -208,0"/></defs>
          <circle cx="140" cy="140" r="128" fill="#ff4a0d"/>
          <circle cx="140" cy="140" r="82" fill="none" stroke="#0b0b0b" stroke-width="1.5" opacity=".5"/>
          <g id="s5ring"><text font-family="Mono" font-size="17" font-weight="700" letter-spacing="3.6" fill="#0b0b0b">
            <textPath href="#ring">ALBUM · PLATZ 1 · DEUTSCHLAND · 2024 · ALBUM · PLATZ 1 · </textPath></text></g>
          <text x="140" y="172" text-anchor="middle" font-family="ArchivoV" font-weight="900" font-size="98" fill="#f2eee5"
                style="font-variation-settings:'wdth' 70,'wght' 900">#1</text>
        </svg>
        <div class="abs mono" id="s5cap"></div>
      </div>
      <div id="s5white"></div>
    </section>

    <!-- S6 · NR. 1 -->
    <section class="scene" id="s6">
      <div id="s6inner">
        <div class="abs big" id="s6ghost">NR.1</div>
        <div id="s6board">
          <div class="abs mono" id="s6head"><span>NR. 1 — DEUTSCHE CHARTS</span><span class="dim2">JAHR · TITEL · PLATZ</span></div>
          <div id="s6rows"></div>
        </div>
      </div>
      <div id="s6flood"></div>
    </section>

    <!-- S7 · LOUNGE MUSIK -->
    <section class="scene" id="s7">
      <div id="s7inner">
        <div class="layer" id="s7flat" style="background:#ff4a0d"></div>
        <div class="layer" id="s7grain"></div>
        <div class="abs serif" id="s7title"><span class="ln" id="s7l1">Lounge</span><span class="ln" id="s7l2">Musik</span></div>
        <img id="s7cut" src="assets/img/lounge_cut.png" alt="">
        <div class="abs" id="s7badges">
          <div class="badge"><em>#1</em>DE</div><div class="badge"><em>#1</em>AT</div><div class="badge"><em>#1</em>CH</div>
        </div>
        <div class="abs mono" id="s7cap"></div>
      </div>
    </section>

    <!-- S8 · HIMMEL ÜBER BERLIN / TEMPELHOF -->
    <section class="scene" id="s8">
      <div id="s8inner">
        <img id="s8sky" src="assets/img/sky_plate.jpg" alt="">
        <div id="s8rays"></div>
        <div class="layer" id="s8shade"></div>
        <img id="s8cut" src="assets/img/himmel_cut.png" alt="">
        <div class="abs serif" id="s8title"><span class="ln" id="s8l1">Himmel</span><span class="ln" id="s8l2">über Berlin.</span></div>
        <div class="abs mono" id="s8cap"></div>
      </div>
      <div id="s8flare"></div>
    </section>

    <!-- S9 · END -->
    <section class="scene" id="s9">
      <div class="abs big" id="s9logo">PASHANIM</div>
      <div id="s9line"></div>
      <div class="abs serif" id="s9tag"></div>
      <div class="abs mono" id="s9small"></div>
      <div class="abs mono" id="s9fan"></div>
    </section>
  </div>

/* =====================================================================

const W = 1920, H = 1080, FPS = 60, FRAMES = 900;

  in: cubicBezier(0.4, 0, 1, 1),           // spec ease-in (exits)
  inOut: cubicBezier(0.65, 0, 0.35, 1),    // spec ease-in-out (on-screen moves)

const S = {};

function fitFont(el, family, settings, targetW, weight = 900) {
  const probe = document.createElement("span");
  probe.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font-family:${family};font-size:100px;font-weight:${weight};font-variation-settings:${settings}`;
  probe.textContent = el.textContent; document.body.appendChild(probe);
  const w = probe.getBoundingClientRect().width; probe.remove();
  return 100 * targetW / w;
}

function buildS3() {

function pathBounds(d) {
  const toks = d.match(/[A-Za-z]|-?\d*\.?\d+(?:e[-+]?\d+)?/g);
  let cmd = "M", idx = 0, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const t of toks) {
    if (/[A-Za-z]/.test(t)) { cmd = t; idx = 0; continue; }
    const v = parseFloat(t);
    const isX = cmd === "H" || (cmd !== "V" && idx % 2 === 0);
    if (isX) { x0 = Math.min(x0, v); x1 = Math.max(x1, v); } else { y0 = Math.min(y0, v); y1 = Math.max(y1, v); }

}

  for (const t of toks) {

function flashAt(f) {

}
function shakeAt(f) {

  }
  return [x, y];
}

function updS1(f) {

    const p = E.outExpo(clamp(l / 10));

    d.grp.setAttribute("transform", tr);

      $("#s1bg").setAttribute("d", "M-60 -60 H1980 V1140 H-60 Z " + xformPath(s.counterD, sk, tx, ty));
    }

}

async function boot() {

  await document.fonts.load('500 20px "Mono"'); await document.fonts.ready;
  buildS1(); buildS2(); buildS3(); buildS4(); buildS5(); buildS6(); buildS7(); buildS8(); buildS9(); buildHUD();
  // wait for every raster to decode
  const imgs = [...document.querySelectorAll("img")];
  await Promise.all(imgs.map(i => i.decode().catch(() => {})));
  await Promise.all(["portrait.jpg", "album_2000.jpg", "sommergewitter.jpg", "mittelmeer.jpg", "gruenewuerfelflow.jpg", "lounge_thumb.jpg"]
    .map(n => { const i = new Image(); i.src = "assets/img/" + n; return i.decode().catch(() => {}); }));
  // fit preview
  const stage = $("#stage");
  const fit = () => {
    if (render) { stage.style.transform = "none"; return; }
    const s = Math.min(innerWidth / W, (innerHeight - 44) / H);
    stage.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - 44 - H * s) / 2}px) scale(${s})`;
  };
  fit(); addEventListener("resize", fit);
  window.__seek = (f) => { renderFrame(f); return f; };
  window.__maTimeline = { duration: FRAMES / FPS, fps: FPS, seek: (t) => renderFrame(t * FPS) };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  renderFrame(reduce && !render ? 840 : 0);
  // preview transport (audio-locked)
  const audio = $("#audio"), btn = $("#play"), scrub = $("#scrub"), uitc = $("#uitc");
  let playing = false;
  const tick = () => {
    if (!playing) return;
    const f = Math.floor(audio.currentTime * FPS);
    renderFrame(f); scrub.value = f; uitc.textContent = `${f} / 899`;
    if (audio.ended || f >= FRAMES - 1) { playing = false; btn.textContent = "▶ Play"; return; }
    requestAnimationFrame(tick);
  };
  btn.onclick = () => {
    if (playing) { audio.pause(); playing = false; btn.textContent = "▶ Play"; return; }
    if (lastF >= FRAMES - 1) audio.currentTime = 0;
    audio.play(); playing = true; btn.textContent = "❚❚ Pause"; tick();
  };
  scrub.oninput = () => { const f = +scrub.value; audio.currentTime = f / FPS; renderFrame(f); uitc.textContent = `${f} / 899`; };
  addEventListener("keydown", e => {
    if (e.key === " ") { btn.click(); e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const f = clamp(lastF + (e.key === "ArrowRight" ? 1 : -1), 0, FRAMES - 1); audio.currentTime = f / FPS; renderFrame(f); scrub.value = f; uitc.textContent = `${f} / 899`; }
  });
  window.__ready = true;
}
boot();
</script>
</body>
</html>
